[platformio]
default_envs = sunseek

[env:sunseek]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_eol = LF
monitor_echo = yes
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1
    -Wno-deprecated-declarations
; Set upload_port = COMx if automatic port detection fails.
; No external libraries: Wire, BLE and HardwareSerial come with the core.
